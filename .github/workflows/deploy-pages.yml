name: Deploy independent demo to GitHub Pages

on:
  push:
    branches: [demo-independent-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build demo
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # GitHub's automatic Jekyll workflow also runs for this branch. Wait for it
      # to finish first, then publish the compiled Vite dist so raw JSX cannot win.
      - name: Wait for automatic branch deployment to finish
        run: sleep 60
      - name: Deploy compiled Vite site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
