name: Build Android Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-test-apk
    paths:
      - '.github/workflows/build-android-test-apk.yml'
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get test UI source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Build test UI
        working-directory: source
        run: |
          npm ci
          # APK assets are served under /assets/www, so use relative Vite asset paths.
          sed -i "s#base: '/hesab-sarraf-test/',#base: './',#" vite.config.js
          npm run build
          test -f dist/index.html
          grep -q 'type="module"' dist/index.html

      - name: Get Android wrapper project
        uses: actions/checkout@v4
        with:
          repository: roohalla41-blip/base44-apk-builder
          ref: main
          path: android

      - name: Prepare standalone Android test app
        working-directory: android
        run: |
          mkdir -p app/src/main/assets/www
          cp -R ../source/dist/. app/src/main/assets/www/
          mkdir -p app/src/main/res/mipmap-mdpi app/src/main/res/drawable app/src/main/res/values
          printf '<resources><color name="test_icon_bg">#FFFFFF</color></resources>' > app/src/main/res/values/test_icon_colors.xml
          printf '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="48dp" android:height="48dp" android:viewportWidth="48" android:viewportHeight="48"><path android:fillColor="#174EA6" android:pathData="M4,4h40v40h-40z"/><path android:fillColor="#FFFFFF" android:pathData="M13,13h22v5h-22zM13,22h22v5h-22zM13,31h15v5h-15z"/></vector>' > app/src/main/res/drawable/test_launcher.xml
          sed -i 's#@mipmap/ic_launcher#@drawable/test_launcher#g' app/src/main/AndroidManifest.xml
          sed -i 's#https://motherapp.base44.app#https://appassets.androidplatform.net/assets/www/index.html#' app/src/main/java/com/base44/apk/MainActivity.java
          sed -i 's/applicationId "com.base44.apk"/applicationId "com.base44.apk.test"/' app/build.gradle
          sed -i 's/android:label="حساب صراف"/android:label="حساب صراف آزمایشی"/' app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/base44/apk/MainActivity.java")
          s = p.read_text(encoding="utf-8")
          if "WebViewAssetLoader" not in s:
              s = s.replace(
                  "import android.webkit.WebViewClient;",
                  "import android.webkit.WebViewClient;\nimport androidx.webkit.WebViewAssetLoader;"
              )
              s = s.replace(
                  "    private WebView webView;",
                  "    private WebView webView;\n    private WebViewAssetLoader assetLoader;"
              )
              s = s.replace(
                  "        webView.setWebViewClient(new WebViewClient() {",
                  "        assetLoader = new WebViewAssetLoader.Builder()\n"
                  "                .addPathHandler(\"/assets/\", new WebViewAssetLoader.AssetsPathHandler(this))\n"
                  "                .build();\n\n"
                  "        webView.setWebViewClient(new WebViewClient() {\n"
                  "            @Override\n"
                  "            public android.webkit.WebResourceResponse shouldInterceptRequest(\n"
                  "                    WebView view, WebResourceRequest request) {\n"
                  "                return assetLoader.shouldInterceptRequest(request.getUrl());\n"
                  "            }\n"
              )
              s = s.replace(
                  'return host.equals("motherapp.base44.app") ||',
                  'return host.equals("appassets.androidplatform.net") ||\n'
                  '                host.equals("motherapp.base44.app") ||'
              )
              p.write_text(s, encoding="utf-8")
          PY
          grep -q 'WebViewAssetLoader' app/src/main/java/com/base44/apk/MainActivity.java
          grep -q 'https://appassets.androidplatform.net/assets/www/index.html' app/src/main/java/com/base44/apk/MainActivity.java
          test -f app/src/main/assets/www/index.html
          test -f app/src/main/assets/www/assets/index-BONFZW5o.js || find app/src/main/assets/www/assets -name '*.js' -print -quit | grep -q '.'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build installable debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Verify and rename APK
        working-directory: android
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          cp "$APK" "Hesab-Sarraf-Test.apk"
          unzip -l "Hesab-Sarraf-Test.apk" | grep -q 'assets/www/index.html'
          unzip -l "Hesab-Sarraf-Test.apk" | grep -q 'assets/www/assets/'
          ls -lh Hesab-Sarraf-Test.apk

      - name: Upload APK for download
        uses: actions/upload-artifact@v4
        with:
          name: Hesab-Sarraf-Test-APK
          path: android/Hesab-Sarraf-Test.apk
          if-no-files-found: error
          retention-days: 14
