name: Build Android Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-test-apk
    paths:
      - '.github/workflows/build-android-test-apk.yml'
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get test UI source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Build test UI
        working-directory: source
        run: |
          npm ci
          npm run build
          test -f dist/index.html

      - name: Get Android wrapper project
        uses: actions/checkout@v4
        with:
          repository: roohalla41-blip/base44-apk-builder
          ref: main
          path: android

      - name: Prepare standalone Android test app
        working-directory: android
        run: |
          mkdir -p app/src/main/assets/www
          cp -R ../source/dist/. app/src/main/assets/www/
          sed -i 's#https://motherapp.base44.app#file:///android_asset/www/index.html#' app/src/main/java/com/base44/apk/MainActivity.java
          sed -i 's/applicationId "com.base44.apk"/applicationId "com.base44.apk.test"/' app/build.gradle
          sed -i 's/android:label="حساب صراف"/android:label="حساب صراف آزمایشی"/' app/src/main/AndroidManifest.xml
          grep -q 'file:///android_asset/www/index.html' app/src/main/java/com/base44/apk/MainActivity.java
          test -f app/src/main/assets/www/index.html

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build installable debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Verify and rename APK
        working-directory: android
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          cp "$APK" "Hesab-Sarraf-Test.apk"
          ls -lh Hesab-Sarraf-Test.apk

      - name: Upload APK for download
        uses: actions/upload-artifact@v4
        with:
          name: Hesab-Sarraf-Test-APK
          path: android/Hesab-Sarraf-Test.apk
          if-no-files-found: error
          retention-days: 14
