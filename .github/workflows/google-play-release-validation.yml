name: ATLAS signed Google Play bundle validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-release-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify release signing secrets are configured
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ATLAS_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ATLAS_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ATLAS_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ATLAS_UPLOAD_KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Required GitHub Actions secret is not configured: ${name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Configure the four ATLAS_UPLOAD_* repository secrets before running this workflow."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore upload keystore to temporary runner storage
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ATLAS_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/atlas-upload-key.jks"
          test -s "$RUNNER_TEMP/atlas-upload-key.jks"

      - name: Build signed Android App Bundle
        env:
          ATLAS_UPLOAD_STORE_FILE: ${{ runner.temp }}/atlas-upload-key.jks
          ATLAS_UPLOAD_STORE_PASSWORD: ${{ secrets.ATLAS_UPLOAD_STORE_PASSWORD }}
          ATLAS_UPLOAD_KEY_ALIAS: ${{ secrets.ATLAS_UPLOAD_KEY_ALIAS }}
          ATLAS_UPLOAD_KEY_PASSWORD: ${{ secrets.ATLAS_UPLOAD_KEY_PASSWORD }}
        run: gradle --no-daemon :app:bundleRelease

      - name: Verify AAB signature
        run: jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab

      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/atlas-upload-key.jks"

# This workflow validates a signed AAB but deliberately does not upload or publish it.
