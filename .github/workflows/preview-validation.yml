name: ATLAS web preview validation

on:
  push:
    branches: [atlas-preview-pages]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate preview JavaScript syntax
        run: node --check app.js
      - name: Verify preview entry points
        shell: bash
        run: |
          test -s index.html
          test -s styles.css
          grep -q 'data-panel="integrations"' index.html
          grep -q 'integrations:' app.js
